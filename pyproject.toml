[project]
name = "fingerflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bitstring==3.1.9",
    "huggingface-hub>=0.35.3",
    "ipykernel>=7.1.0",
    "matplotlib==3.10.6",
    "numpy==2.3.3",
    "opencv-python==4.11.0.86",
    "pandas==2.2.3",
    "pip>=25.3",
    "pylint>=3.0",
    "scikit-image>=0.25.2",
    "scikit-learn==1.6.1",
    "scipy==1.15.2",
    "tensorflow[and-cuda]>=2.20.0",
    "wrapt>=1.17",
]

[tool.pytest.ini_options]
# The unit tests live in test/. The files under scripts/legacy/ are stand-alone measurement
# scripts with hard-coded paths, not tests, although two of them are named *_test.py.
testpaths = ["test"]
